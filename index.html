<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Private Procurement List</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:Arial,sans-serif;background:#f0f2f5;color:#222;font-size:13px;}
/* Layout */
.app{display:flex;height:100vh;overflow:hidden;}
/* Sidebar */
.sidebar{width:240px;min-width:200px;background:#1a3c5e;color:#fff;display:flex;flex-direction:column;overflow:hidden;flex-shrink:0;}
.sidebar-header{padding:14px 12px 10px;border-bottom:1px solid rgba(255,255,255,.15);}
.sidebar-header h2{font-size:13px;font-weight:700;color:#8ec6f0;letter-spacing:.3px;margin-bottom:2px;}
.sidebar-header .sub{font-size:11px;color:rgba(255,255,255,.55);}
.trade-search{padding:8px 10px;}
.trade-search input{width:100%;padding:5px 8px;border-radius:4px;border:none;font-size:12px;background:rgba(255,255,255,.15);color:#fff;}
.trade-search input::placeholder{color:rgba(255,255,255,.45);}
.trade-list{flex:1;overflow-y:auto;}
.trade-item{padding:7px 12px;cursor:pointer;border-left:3px solid transparent;font-size:12px;color:rgba(255,255,255,.8);transition:background .15s;}
.trade-item:hover{background:rgba(255,255,255,.1);}
.trade-item.active{background:rgba(255,255,255,.15);border-left-color:#5ba8e0;color:#fff;font-weight:600;}
.trade-item .cnt{float:right;font-size:10px;color:rgba(255,255,255,.45);margin-top:1px;}
/* Main */
.main{flex:1;display:flex;flex-direction:column;overflow:hidden;}
.topbar{background:#fff;border-bottom:1px solid #dde;padding:10px 16px;display:flex;align-items:center;gap:10px;flex-wrap:wrap;}
.topbar h1{font-size:15px;font-weight:700;color:#1a3c5e;margin-right:8px;}
.search-wrap{flex:1;min-width:180px;max-width:340px;position:relative;}
.search-wrap input{width:100%;padding:6px 10px 6px 30px;border:1px solid #ccc;border-radius:6px;font-size:12px;}
.search-wrap svg{position:absolute;left:8px;top:7px;color:#aaa;}
.filter-btns{display:flex;gap:6px;flex-wrap:wrap;}
.fbtn{padding:4px 10px;border-radius:12px;border:1px solid #ccc;background:#fff;font-size:11px;cursor:pointer;color:#555;transition:all .15s;}
.fbtn.active{background:#1a3c5e;color:#fff;border-color:#1a3c5e;}
.view-btns{display:flex;gap:4px;margin-left:auto;}
.vbtn{padding:4px 10px;border:1px solid #ccc;background:#fff;font-size:11px;cursor:pointer;border-radius:4px;color:#555;}
.vbtn.active{background:#1a3c5e;color:#fff;border-color:#1a3c5e;}
.toolbar{background:#f8f9fb;border-bottom:1px solid #e0e4e8;padding:6px 16px;display:flex;align-items:center;gap:8px;}
.toolbar span{font-size:12px;color:#666;}
.toolbar button{padding:4px 12px;border-radius:4px;border:1px solid #bbb;background:#fff;font-size:11px;cursor:pointer;color:#333;}
.toolbar button:hover{background:#eaf2fb;border-color:#5ba8e0;}
.content{flex:1;overflow-y:auto;padding:14px 16px;}
/* Cards */
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px;}
.card{background:#fff;border:1px solid #dde;border-radius:8px;padding:12px 14px;position:relative;}
.card.contacted{border-left:4px solid #27ae60;}
.card.no-quote{border-left:4px solid #e74c3c;opacity:.8;}
.card.pending{border-left:4px solid #f39c12;}
.card.received{border-left:4px solid #2980b9;}
.card-top{display:flex;align-items:flex-start;gap:10px;margin-bottom:8px;}
.avatar{width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:12px;flex-shrink:0;color:#fff;}
.card-name{font-size:13px;font-weight:700;color:#1a3c5e;line-height:1.3;}
.card-trade{font-size:11px;color:#888;margin-top:2px;}
.card-bca{display:inline-block;padding:1px 6px;background:#e8f4fd;color:#2980b9;border-radius:3px;font-size:10px;font-weight:600;margin-top:3px;}
.card-info{font-size:11px;color:#555;line-height:1.8;}
.card-info a{color:#2980b9;text-decoration:none;}
.card-info a:hover{text-decoration:underline;}
.card-footer{margin-top:8px;padding-top:8px;border-top:1px solid #f0f0f0;display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
.status-sel{font-size:11px;padding:3px 6px;border:1px solid #ddd;border-radius:4px;background:#fff;cursor:pointer;}
.contacted-cb{display:flex;align-items:center;gap:4px;font-size:11px;cursor:pointer;}
.contacted-cb input{cursor:pointer;}
.card-remark{font-size:11px;color:#666;font-style:italic;flex:1;}
.edit-btn{margin-left:auto;padding:2px 8px;font-size:10px;border:1px solid #ccc;border-radius:4px;background:#fff;cursor:pointer;color:#555;}
.edit-btn:hover{background:#eaf2fb;}
/* Table */
.tbl-wrap{overflow-x:auto;}
table{width:100%;border-collapse:collapse;background:#fff;font-size:11px;}
thead th{background:#1a3c5e;color:#fff;padding:7px 8px;text-align:left;white-space:nowrap;position:sticky;top:0;z-index:2;}
tbody tr:nth-child(even){background:#f7f9fc;}
tbody tr:hover{background:#eaf2fb;}
td{padding:6px 8px;border-bottom:1px solid #eee;vertical-align:middle;}
td.company{font-weight:600;color:#1a3c5e;}
td.contacted-row{text-align:center;}
.tag{display:inline-block;padding:1px 6px;border-radius:10px;font-size:10px;font-weight:600;}
.tag-contacted{background:#d5f5e3;color:#27ae60;}
.tag-no-quote{background:#fde8e8;color:#e74c3c;}
.tag-pending{background:#fef9e7;color:#f39c12;}
.tag-received{background:#d6eaf8;color:#2980b9;}
.tag-none{background:#f0f0f0;color:#888;}
/* Modal */
.modal-bg{display:none;position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:100;align-items:center;justify-content:center;}
.modal-bg.open{display:flex;}
.modal{background:#fff;border-radius:10px;padding:20px 24px;width:520px;max-width:96vw;max-height:90vh;overflow-y:auto;}
.modal h3{font-size:15px;color:#1a3c5e;margin-bottom:14px;font-weight:700;}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.form-group{display:flex;flex-direction:column;gap:3px;}
.form-group.full{grid-column:1/-1;}
.form-group label{font-size:11px;color:#666;font-weight:600;}
.form-group input,.form-group select,.form-group textarea{padding:6px 8px;border:1px solid #ccc;border-radius:5px;font-size:12px;font-family:Arial,sans-serif;}
.form-group textarea{resize:vertical;min-height:60px;}
.modal-btns{display:flex;gap:8px;margin-top:14px;justify-content:flex-end;}
.btn-primary{padding:7px 18px;background:#1a3c5e;color:#fff;border:none;border-radius:5px;font-size:12px;cursor:pointer;}
.btn-primary:hover{background:#245580;}
.btn-secondary{padding:7px 18px;background:#fff;color:#555;border:1px solid #ccc;border-radius:5px;font-size:12px;cursor:pointer;}
.btn-danger{padding:7px 14px;background:#fff;color:#e74c3c;border:1px solid #e74c3c;border-radius:5px;font-size:12px;cursor:pointer;margin-right:auto;}
/* Toast */
.toast{position:fixed;bottom:20px;right:20px;background:#222;color:#fff;padding:9px 18px;border-radius:6px;font-size:12px;opacity:0;transition:opacity .3s;z-index:999;pointer-events:none;}
.toast.show{opacity:1;}
/* Loading */
.loading{text-align:center;padding:40px;color:#888;font-size:13px;}
/* Sync indicator */
.sync-dot{width:8px;height:8px;border-radius:50%;background:#27ae60;display:inline-block;margin-right:4px;}
.sync-dot.syncing{background:#f39c12;animation:pulse .8s infinite;}
@keyframes pulse{0%,100%{opacity:1;}50%{opacity:.4;}}
.empty{text-align:center;padding:60px;color:#aaa;}
</style>
</head>
<body>
<div class="app">
  <div class="sidebar">
    <div class="sidebar-header">
      <h2>Private Procurement List</h2>
      <div class="sub">Shared across team</div>
    </div>
    <div class="trade-search">
      <input type="text" id="tradeSearch" placeholder="Filter trades…" oninput="renderSidebar()">
    </div>
    <div class="trade-list" id="tradeList"></div>
  </div>
  <div class="main">
    <div class="topbar">
      <h1>📋 Private Procurement Directory</h1>
      <div class="search-wrap">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="M21 21l-4.35-4.35"/></svg>
        <input type="text" id="searchInput" placeholder="Search company, contact, trade…" oninput="render()">
      </div>
      <div class="filter-btns">
        <button class="fbtn active" onclick="setFilter('all',this)">All</button>
        <button class="fbtn" onclick="setFilter('contacted',this)">✓ Contacted</button>
        <button class="fbtn" onclick="setFilter('send_enquiry',this)">Send Enquiry</button>
        <button class="fbtn" onclick="setFilter('pending',this)">Pending</button>
        <button class="fbtn" onclick="setFilter('no_quote',this)">No Quote</button>
        <button class="fbtn" onclick="setFilter('received',this)">Received</button>
      </div>
      <div class="view-btns">
        <button class="vbtn active" id="vCard" onclick="setView('card',this)">Cards</button>
        <button class="vbtn" id="vTable" onclick="setView('table',this)">Table</button>
      </div>
    </div>
    <div class="toolbar">
      <span id="syncStatus"><span class="sync-dot" id="syncDot"></span>Live Sync</span>
      <span id="countLabel" style="margin-left:8px;"></span>
      <button onclick="openModal(null)">+ Add Contact</button>
      <button onclick="exportCSV()">Export CSV</button>
      <button onclick="loadSharedStatus()">🔄 Refresh</button>
    </div>
    <div class="content" id="content"><div class="loading">Loading…</div></div>
  </div>
</div>

<!-- Modal -->
<div class="modal-bg" id="modalBg" onclick="if(event.target===this)closeModal()">
  <div class="modal">
    <h3 id="modalTitle">Add Contact</h3>
    <div class="form-grid">
      <div class="form-group full"><label>Trade</label><input id="fTrade" placeholder="e.g. Waterproofing"></div>
      <div class="form-group full"><label>Company Name *</label><input id="fCompany" placeholder="Company name"></div>
      <div class="form-group"><label>BCA Grade</label><input id="fBca" placeholder="e.g. L5"></div>
      <div class="form-group"><label>Contact Person</label><input id="fContact" placeholder="Name / HP"></div>
      <div class="form-group"><label>DID</label><input id="fDid"></div>
      <div class="form-group"><label>Tel</label><input id="fTel"></div>
      <div class="form-group"><label>Fax</label><input id="fFax"></div>
      <div class="form-group"><label>H/P</label><input id="fHp"></div>
      <div class="form-group full"><label>Email 1</label><input id="fEmail1" type="email"></div>
      <div class="form-group full"><label>Email 2</label><input id="fEmail2" type="email"></div>
      <div class="form-group full"><label>Remarks</label><textarea id="fRemark"></textarea></div>
      <div class="form-group full"><label>Status</label>
        <select id="fStatus">
          <option value="">— None —</option>
          <option value="send_enquiry">Send Enquiry</option>
          <option value="pending">Pending Info, Send Later</option>
          <option value="no_quote">Reply: No Quote</option>
          <option value="received">Received Quotation</option>
        </select>
      </div>
    </div>
    <div class="modal-btns">
      <button class="btn-danger" id="deleteBtn" onclick="deleteContact()" style="display:none">Delete</button>
      <button class="btn-secondary" onclick="closeModal()">Cancel</button>
      <button class="btn-primary" onclick="saveModal()">Save</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

// ---------- STATE ----------
let records = BASE_DATA.map(r=>({...r}));
let additions = [];
let statusMap = {}; // id -> {status, contacted, contactedDate, remark, invNo}
let currentTrade = '__all__';
let currentFilter = 'all';
let currentView = 'card';
let editingId = null;
const STORAGE_KEY = 'private_procurement_status_v1';
const ADDITIONS_KEY = 'private_procurement_additions_v1';

// Colour palette for avatars
const COLOURS = ['#1a3c5e','#2980b9','#27ae60','#8e44ad','#c0392b','#d35400','#16a085','#2c3e50'];
function avatarColor(str){let h=0;for(let c of str)h=(h*31+c.charCodeAt(0))&0xffff;return COLOURS[h%COLOURS.length];}
function initials(str){return str.split(/\s+/).map(w=>w[0]||'').join('').slice(0,2).toUpperCase()||'?';}

// ---------- STORAGE (window.storage shared) ----------
async function sget(key){try{const r=await window.storage.get(key,true);return r?JSON.parse(r.value):null;}catch{return null;}}
async function sset(key,val){try{await window.storage.set(key,JSON.stringify(val),true);}catch(e){console.warn('sset',e);}}

async function loadSharedStatus(){
  setSyncing(true);
  const [sm, adds] = await Promise.all([sget(STORAGE_KEY), sget(ADDITIONS_KEY)]);
  if(sm) statusMap = sm;
  if(adds && Array.isArray(adds)){
    additions = adds;
    // Merge additions into records (avoid duplicates)
    const baseIds = new Set(BASE_DATA.map(r=>r.id));
    records = [...BASE_DATA, ...additions.filter(a=>!baseIds.has(a.id))];
  }
  setSyncing(false);
  renderSidebar();
  render();
}

async function saveStatus(){
  setSyncing(true);
  await sset(STORAGE_KEY, statusMap);
  setSyncing(false);
}

async function saveAdditions(){
  await sset(ADDITIONS_KEY, additions);
}

function setSyncing(v){
  const d=document.getElementById('syncDot');
  if(d) v ? d.classList.add('syncing') : d.classList.remove('syncing');
}

// ---------- FILTER / SEARCH ----------
function getFiltered(){
  const q = document.getElementById('searchInput').value.toLowerCase().trim();
  const tradeList = currentTrade === '__all__' ? records : records.filter(r=>r.trade===currentTrade);
  return tradeList.filter(r=>{
    if(q && !['company','trade','contact','tel','hp','did','email1','email2','remark'].some(k=>(r[k]||'').toLowerCase().includes(q))) return false;
    const st = statusMap[r.id];
    if(currentFilter==='all') return true;
    if(currentFilter==='contacted') return st?.contacted;
    if(currentFilter==='send_enquiry') return st?.status==='send_enquiry';
    if(currentFilter==='pending') return st?.status==='pending';
    if(currentFilter==='no_quote') return st?.status==='no_quote';
    if(currentFilter==='received') return st?.status==='received';
    return true;
  });
}

function setFilter(f,btn){
  currentFilter=f;
  document.querySelectorAll('.fbtn').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  render();
}

function setView(v,btn){
  currentView=v;
  document.querySelectorAll('.vbtn').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  render();
}

// ---------- SIDEBAR ----------
function renderSidebar(){
  const q = document.getElementById('tradeSearch').value.toLowerCase().trim();
  // Count per trade
  const tradeCounts = {};
  records.forEach(r=>{ tradeCounts[r.trade]=(tradeCounts[r.trade]||0)+1; });

  let trades = Object.entries(tradeCounts);
  if(q) trades = trades.filter(([t])=>t.toLowerCase().includes(q));
  trades.sort((a,b)=>a[0].localeCompare(b[0]));

  const totalFiltered = q ? trades.reduce((s,[,c])=>s+c,0) : records.length;

  let html = `<div class="trade-item ${currentTrade==='__all__'?'active':''}" onclick="selectTrade('__all__')">All Trades <span class="cnt">${totalFiltered}</span></div>`;
  trades.forEach(([t,c])=>{
    html += `<div class="trade-item ${currentTrade===t?'active':''}" onclick="selectTrade('${t.replace(/'/g,"\\'")}')"><span>${t}</span><span class="cnt">${c}</span></div>`;
  });
  document.getElementById('tradeList').innerHTML = html;
}

function selectTrade(t){currentTrade=t;renderSidebar();render();}

// ---------- RENDER ----------
const STATUS_LABELS = {send_enquiry:'Send Enquiry',pending:'Pending',no_quote:'No Quote',received:'Received'};
const STATUS_TAGS = {send_enquiry:'tag-contacted',pending:'tag-pending',no_quote:'tag-no-quote',received:'tag-received'};

function render(){
  const filtered = getFiltered();
  document.getElementById('countLabel').textContent = `${filtered.length} subcontractors`;
  const cont = document.getElementById('content');
  if(!filtered.length){cont.innerHTML='<div class="empty">No results found.</div>';return;}
  cont.innerHTML = currentView==='card' ? renderCards(filtered) : renderTable(filtered);
}

function renderCards(list){
  return `<div class="cards">${list.map(r=>{
    const st = statusMap[r.id]||{};
    const cls = st.contacted?'contacted':st.status?st.status.replace('_','-'):'';
    const col = avatarColor(r.company);
    const tel = r.tel||r.did||r.hp||'';
    const email = r.email1||r.email2||'';
    const statusTag = st.status ? `<span class="tag ${STATUS_TAGS[st.status]||'tag-none'}">${STATUS_LABELS[st.status]||st.status}</span>` : '';
    return `<div class="card ${cls}">
      <div class="card-top">
        <div class="avatar" style="background:${col}">${initials(r.company)}</div>
        <div>
          <div class="card-name">${esc(r.company)}</div>
          <div class="card-trade">${esc(r.trade)}</div>
          ${r.bca?`<span class="card-bca">BCA ${esc(r.bca)}</span>`:''}
        </div>
      </div>
      <div class="card-info">
        ${r.contact?`<div>👤 ${esc(r.contact)}</div>`:''}
        ${tel?`<div>📞 ${esc(tel)}</div>`:''}
        ${email?`<div>✉️ <a href="mailto:${esc(email)}">${esc(email)}</a></div>`:''}
        ${st.remark?`<div style="color:#e67e22;margin-top:3px">💬 ${esc(st.remark)}</div>`:''}
      </div>
      <div class="card-footer">
        <label class="contacted-cb">
          <input type="checkbox" ${st.contacted?'checked':''} onchange="toggleContacted('${r.id}',this.checked)">
          Contacted${st.contactedDate?' ('+st.contactedDate+')':''}
        </label>
        <select class="status-sel" onchange="setStatus('${r.id}',this.value)">
          <option value="" ${!st.status?'selected':''}>— Status —</option>
          <option value="send_enquiry" ${st.status==='send_enquiry'?'selected':''}>Send Enquiry</option>
          <option value="pending" ${st.status==='pending'?'selected':''}>Pending</option>
          <option value="no_quote" ${st.status==='no_quote'?'selected':''}>No Quote</option>
          <option value="received" ${st.status==='received'?'selected':''}>Received</option>
        </select>
        ${statusTag}
        <button class="edit-btn" onclick="openModal('${r.id}')">Edit</button>
      </div>
    </div>`;
  }).join('')}</div>`;
}

function renderTable(list){
  return `<div class="tbl-wrap"><table>
    <thead><tr>
      <th>No</th><th>Trade</th><th>Company</th><th>BCA</th><th>Contact</th><th>Tel / H/P</th><th>Email</th><th>Contacted</th><th>Status</th><th>Remark</th><th>Action</th>
    </tr></thead>
    <tbody>${list.map((r,i)=>{
      const st=statusMap[r.id]||{};
      const tel=r.tel||r.did||r.hp||'';
      const email=r.email1||'';
      const sTag=st.status?`<span class="tag ${STATUS_TAGS[st.status]||'tag-none'}">${STATUS_LABELS[st.status]||st.status}</span>`:`<span class="tag tag-none">—</span>`;
      return `<tr>
        <td>${i+1}</td>
        <td>${esc(r.trade)}</td>
        <td class="company">${esc(r.company)}</td>
        <td>${esc(r.bca)}</td>
        <td>${esc(r.contact)}</td>
        <td>${esc(tel)}</td>
        <td>${email?`<a href="mailto:${esc(email)}">${esc(email)}</a>`:''}</td>
        <td class="contacted-row"><input type="checkbox" ${st.contacted?'checked':''} onchange="toggleContacted('${r.id}',this.checked)"></td>
        <td>
          <select class="status-sel" onchange="setStatus('${r.id}',this.value)">
            <option value="" ${!st.status?'selected':''}>—</option>
            <option value="send_enquiry" ${st.status==='send_enquiry'?'selected':''}>Send Enquiry</option>
            <option value="pending" ${st.status==='pending'?'selected':''}>Pending</option>
            <option value="no_quote" ${st.status==='no_quote'?'selected':''}>No Quote</option>
            <option value="received" ${st.status==='received'?'selected':''}>Received</option>
          </select>
        </td>
        <td>${esc(st.remark||'')}</td>
        <td><button class="edit-btn" onclick="openModal('${r.id}')">Edit</button></td>
      </tr>`;
    }).join('')}</tbody>
  </table></div>`;
}

function esc(s){if(!s)return'';return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}

// ---------- STATUS ACTIONS ----------
async function toggleContacted(id,checked){
  if(!statusMap[id]) statusMap[id]={};
  statusMap[id].contacted=checked;
  statusMap[id].contactedDate=checked?new Date().toLocaleDateString('en-GB'):'';
  await saveStatus();
  render();
  toast(checked?'Marked as contacted':'Unmarked');
}

async function setStatus(id,val){
  if(!statusMap[id]) statusMap[id]={};
  statusMap[id].status=val;
  await saveStatus();
  render();
  toast('Status updated');
}

// ---------- MODAL ----------
function openModal(id){
  editingId=id;
  const r = id ? records.find(x=>x.id===id) : null;
  const st = id ? (statusMap[id]||{}) : {};
  document.getElementById('modalTitle').textContent = id ? 'Edit Contact' : 'Add Contact';
  document.getElementById('deleteBtn').style.display = id && additions.find(a=>a.id===id) ? '' : 'none';
  document.getElementById('fTrade').value=r?.trade||'';
  document.getElementById('fCompany').value=r?.company||'';
  document.getElementById('fBca').value=r?.bca||'';
  document.getElementById('fContact').value=r?.contact||'';
  document.getElementById('fDid').value=r?.did||'';
  document.getElementById('fTel').value=r?.tel||'';
  document.getElementById('fFax').value=r?.fax||'';
  document.getElementById('fHp').value=r?.hp||'';
  document.getElementById('fEmail1').value=r?.email1||'';
  document.getElementById('fEmail2').value=r?.email2||'';
  document.getElementById('fRemark').value=st.remark||r?.remark||'';
  document.getElementById('fStatus').value=st.status||'';
  document.getElementById('modalBg').classList.add('open');
}

function closeModal(){document.getElementById('modalBg').classList.remove('open');editingId=null;}

async function saveModal(){
  const company=document.getElementById('fCompany').value.trim();
  if(!company){alert('Company name is required.');return;}
  const trade=document.getElementById('fTrade').value.trim();
  const status=document.getElementById('fStatus').value;
  const remark=document.getElementById('fRemark').value.trim();

  if(editingId){
    // Update status/remark
    if(!statusMap[editingId]) statusMap[editingId]={};
    statusMap[editingId].status=status;
    statusMap[editingId].remark=remark;
    // If it's an addition, also update the record fields
    const idx=additions.findIndex(a=>a.id===editingId);
    if(idx>=0){
      additions[idx]={...additions[idx],
        trade,company,bca:document.getElementById('fBca').value.trim(),
        contact:document.getElementById('fContact').value.trim(),
        did:document.getElementById('fDid').value.trim(),
        tel:document.getElementById('fTel').value.trim(),
        fax:document.getElementById('fFax').value.trim(),
        hp:document.getElementById('fHp').value.trim(),
        email1:document.getElementById('fEmail1').value.trim(),
        email2:document.getElementById('fEmail2').value.trim(),
      };
      const ri=records.findIndex(r=>r.id===editingId);
      if(ri>=0) records[ri]={...records[ri],...additions[idx]};
      await saveAdditions();
    }
    await saveStatus();
    toast('Contact updated');
  } else {
    const newId='add_'+Date.now();
    const rec={
      id:newId,trade_no:'',trade,company,
      bca:document.getElementById('fBca').value.trim(),
      contact:document.getElementById('fContact').value.trim(),
      did:document.getElementById('fDid').value.trim(),
      tel:document.getElementById('fTel').value.trim(),
      fax:document.getElementById('fFax').value.trim(),
      hp:document.getElementById('fHp').value.trim(),
      email1:document.getElementById('fEmail1').value.trim(),
      email2:document.getElementById('fEmail2').value.trim(),
      remark:'',inv_no:'',
    };
    additions.push(rec);
    records.push(rec);
    if(status||remark){
      statusMap[newId]={status,remark};
      await saveStatus();
    }
    await saveAdditions();
    toast('Contact added');
  }
  closeModal();
  renderSidebar();
  render();
}

async function deleteContact(){
  if(!editingId) return;
  if(!confirm('Delete this contact?')) return;
  additions=additions.filter(a=>a.id!==editingId);
  records=records.filter(r=>r.id!==editingId);
  delete statusMap[editingId];
  await Promise.all([saveAdditions(),saveStatus()]);
  closeModal();
  renderSidebar();
  render();
  toast('Contact deleted');
}

// ---------- EXPORT ----------
function exportCSV(){
  const list=getFiltered();
  const h=['Trade','Company','BCA','Contact','Tel','HP','Email1','Email2','Contacted','Contact Date','Status','Remark'];
  const rows=list.map(r=>{
    const st=statusMap[r.id]||{};
    return [r.trade,r.company,r.bca,r.contact,r.tel,r.hp,r.email1,r.email2,
      st.contacted?'Yes':'No',st.contactedDate||'',st.status||'',st.remark||'']
    .map(v=>`"${String(v||'').replace(/"/g,'""')}"`);
  });
  const csv=[h.join(','),...rows.map(r=>r.join(','))].join('\n');
  const a=document.createElement('a');
  a.href='data:text/csv;charset=utf-8,'+encodeURIComponent(csv);
  a.download='Private_Procurement_List.csv';
  a.click();
  toast('Exported ✓');
}

function toast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2200);}

// Init
loadSharedStatus();
// Auto-refresh every 60 seconds
setInterval(loadSharedStatus, 60000);
